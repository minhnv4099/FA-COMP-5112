<div class="settings-card">
    <h2>System Settings</h2>
    <hr>
    <div class="setting-item">
        <label>API Endpoint</label>
        <input type="text" id="apiEndpoint" value="http://127.0.0.1:8000">
    </div>
    <div class="setting-item">
        <label>Appearance Mode</label>
        <select id="themeSelect">
            <option value="dark">Dark Ocean</option>
            <option value="light">Light Minimal</option>
        </select>
    </div>
    <div class="setting-item">
        <label>MCP Refresh Interval (ms)</label>
        <input type="number" id="mcpInterval" value="5000">
    </div>
    <div class="settings-actions">
        <button class="btn-primary" onclick="saveSettings()">Save Configuration</button>
        <button class="btn-secondary" onclick="showPage('home')">Cancel</button>
    </div>
</div>
