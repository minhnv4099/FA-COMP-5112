# @package agent.coding

name: Coding
metadata:
  description: This node acts as a coding agent, generating Python code
    based on given subtask and relevant document or/and code snippet

template_file: templates/prompt/general/coding.yaml
script_folder: assets/blender_script/
anchor_script_file: assets/blender_script/anchor_coding.py
check_error_file: assets/blender_script/check_error.py

save_scripts: True
fix_error_attempts: 10

input_schema:
  type: state
  name: coding
chat_output:
  type: chat_output
  name: coding
tool_schemas: [ ]

edges:
  in_coming: [ ]
  out_going: [ ]

use_model: True

model_name: x-ai/grok-4.1-fast #openai/gpt-4.0-mini
model_provider: ~
#model_api_key: <API-KEY>
output_schema_as_tool: True
chat_model: null